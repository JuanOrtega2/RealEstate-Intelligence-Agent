services:
  - type: web
    name: real-estate-intelligence-agent
    env: docker
    plan: free
    region: frankfurt # Or your preferred region
    healthCheckPath: /health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false # You will set this manually in Render dashboard for security
      - key: PORT
        value: 8080
    autoDeploy: true
